# PHASE ACTUELLE : PRÉPRODUCTION (validée par le propriétaire le 12/10/2026).
# La branche main publie la version « aperçu » : bandeau de travail, pages non indexées, formulaire sans envoi.
# MISE EN LIGNE DÉFINITIVE : remplacer la commande par "npm run build:production" et supprimer
# l'en-tête X-Robots-Tag ci-dessous, une fois data/site.json complété et validé (voir GITHUB_NETLIFY.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
